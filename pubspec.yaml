# assets:
name: italicapp
description: Field notebook and lichen identification app based on ITALIC.
publish_to: "none"
version: 0.8.11+24

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  image_picker: ^1.2.4
  idb_shim: ^2.9.9
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  http: ^1.6.0
  share_plus: ^13.3.1
  crypto: ^3.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSansArmenian_OFL.txt
    - assets/branding/italic-go.png
    - assets/italic/italic_checklist.json
    - assets/italic/italic_genus_keys.json
    - assets/italic/flavoparmelia_key.json
    - assets/italic/character_matrix_v2.json
    - assets/italic/character_dictionary_v3.json
    - assets/italic/api_traits_matrix_v2.json
    - assets/italic/physcia_reconstructed_key_v1.json
    - assets/italic/general_reconstructed_key_v1.json
    - assets/italic/species_photos_v1.json
    - assets/photos/
  fonts:
    - family: NotoSansArmenian
      fonts:
        - asset: assets/fonts/NotoSansArmenian.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
